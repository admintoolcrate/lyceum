# GitHub Pages (Settings → Pages → Deploy from a branch → /docs). Hosts the privacy policy Play needs.
title: Lyceum
description: A quiet daily reflection journal.
theme: jekyll-theme-minimal
plugins:
  - jekyll-sitemap
# Drafting notes for Play Console and developer docs aren't pages anyone needs to visit.
exclude:
  - play-store/RELEASE.md
  - play-store/data-safety.md
  - play-store/store-listing.md
  - drive-setup.md
  - stagira-intent.md
