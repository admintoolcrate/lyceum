name: Build

# Every push: quotations checked against the source, unit tests, and a debug APK to download.
# Release runs ("Run workflow" with "release" ticked, or a pushed tag like v1.0) also build the
# signed Play bundle and, once the Play service account is set up, send it to Internal testing.
# See docs/play-store/RELEASE.md.
on:
  push:
    branches: ["**"]
    # Website-only changes (the privacy policy and Play notes in docs/) never build the app.
    # (Path filters don't apply to tag pushes, so a tag always builds.)
    paths-ignore: ["docs/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: Also build the signed Play bundle and upload it to Internal testing (if set up)
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Verify Aristotle quotations against the source text
        run: python3 tools/verify_quotes.py
      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: lyceum-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lyceum-screens
          path: app/build/screens/

  # The signed bundle for Google Play, once the upload key is added as repository secrets.
  play-bundle:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release == true
    env:
      UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Upload key missing
        if: env.UPLOAD_KEYSTORE_BASE64 == ''
        run: echo "::warning::No upload key in the repository secrets, so no Play bundle was built. See docs/play-store/RELEASE.md, step 2."
      - uses: actions/checkout@v5
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
      - uses: actions/setup-java@v5
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
      - name: Build signed release bundle
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/upload.jks"
          RELEASE_STORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew bundleRelease
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v5
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        with:
          name: lyceum-play-bundle
          path: app/build/outputs/bundle/release/app-release.aab
      # Play's "What's new" for testers: the first line of the commit.
      - name: Release notes
        if: env.UPLOAD_KEYSTORE_BASE64 != '' && env.PLAY_SERVICE_ACCOUNT_JSON != ''
        run: |
          mkdir -p whatsnew
          git log -1 --pretty=%s | cut -c1-480 > whatsnew/whatsnew-en-US
          cat whatsnew/whatsnew-en-US
      # Straight to Internal testing (no review). Closed testing and production stay a
      # "Promote release" click in Play Console, so nothing reaches others unseen.
      - name: Upload to Google Play (Internal testing)
        if: env.UPLOAD_KEYSTORE_BASE64 != '' && env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: cc.toolcrate.lyceum
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          track: internal
          status: completed
          whatsNewDirectory: whatsnew
